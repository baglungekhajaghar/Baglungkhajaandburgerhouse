<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3f22"/>
      <stop offset="100%" stop-color="#4a2c17"/>
    </linearGradient>
  </defs>

  <!-- hill -->
  <path d="M0,650 C120,520 260,480 400,470 C540,480 680,520 800,650 L800,800 L0,800 Z" fill="url(#hillGrad)"/>

  <!-- stairway leading up the hill -->
  <g fill="#3d2513">
    <rect x="378" y="600" width="44" height="14"/>
    <rect x="372" y="614" width="56" height="14"/>
    <rect x="366" y="628" width="68" height="14"/>
    <rect x="360" y="642" width="80" height="14"/>
    <rect x="354" y="656" width="92" height="14"/>
    <rect x="348" y="670" width="104" height="14"/>
  </g>

  <!-- trees flanking the hill -->
  <g fill="#2f4a2b">
    <ellipse cx="180" cy="600" rx="34" ry="46"/>
    <ellipse cx="230" cy="630" rx="26" ry="36"/>
    <ellipse cx="620" cy="600" rx="34" ry="46"/>
    <ellipse cx="570" cy="630" rx="26" ry="36"/>
  </g>

  <!-- temple base platform -->
  <rect x="300" y="470" width="200" height="24" fill="#5a3418"/>
  <rect x="315" y="446" width="170" height="24" fill="#5a3418"/>

  <!-- pagoda tier 3 (bottom, widest) -->
  <polygon points="260,446 540,446 480,400 320,400" fill="#7a4a24"/>
  <rect x="330" y="360" width="140" height="40" fill="#8a5a2e"/>

  <!-- pagoda tier 2 -->
  <polygon points="300,360 500,360 452,318 348,318" fill="#7a4a24"/>
  <rect x="352" y="284" width="96" height="34" fill="#8a5a2e"/>

  <!-- pagoda tier 1 (top, narrowest) -->
  <polygon points="330,284 470,284 434,246 366,246" fill="#7a4a24"/>
  <rect x="368" y="222" width="64" height="24" fill="#8a5a2e"/>

  <!-- roof cap / finial -->
  <polygon points="360,222 440,222 400,196" fill="#6b3f22"/>
  <line x1="400" y1="196" x2="400" y2="150" stroke="#6b3f22" stroke-width="6"/>
  <circle cx="400" cy="144" r="8" fill="#6b3f22"/>

  <!-- doorway -->
  <rect x="386" y="424" width="28" height="46" fill="#3d2513"/>

  <!-- small side shrines -->
  <g fill="#6b4126">
    <polygon points="220,460 270,460 245,432" />
    <rect x="228" y="470" width="34" height="24"/>
    <polygon points="530,460 580,460 555,432" />
    <rect x="538" y="470" width="34" height="24"/>
  </g>
</svg>
